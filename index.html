<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Travel Agenda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Enable Tailwind dark mode via class strategy
        tailwind.config = {
            darkMode: 'class',
        }
        
        // Prevent Flash of Unstyled Content (FOUC) by setting theme early
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }

        .sticky-date {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(248, 250, 252, 0.9);
            backdrop-filter: blur(8px);
        }
        
        /* Dark mode sticky background */
        .dark .sticky-date {
            background: rgba(15, 23, 42, 0.9); 
        }

        .timeline-line::before {
            content: '';
            position: absolute;
            left: 20px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #e2e8f0;
        }

        /* Dark mode timeline line */
        .dark .timeline-line::before {
            background: #334155;
        }

        .activity-card {
            transition: transform 0.1s ease, background-color 0.3s ease, border-color 0.3s ease;
        }

        .activity-card:active {
            transform: scale(0.98);
        }

        .birthday-glow {
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from { box-shadow: 0 0 5px #ff69b4; }
            to { box-shadow: 0 0 20px #ff69b4; }
        }
    </style>
</head>
<body class="pb-12 bg-slate-50 dark:bg-slate-900 transition-colors duration-300">

    <!-- Header -->
    <header class="bg-indigo-600 dark:bg-indigo-900 text-white p-6 shadow-lg rounded-b-3xl flex justify-between items-start transition-colors duration-300">
        <div>
            <h1 class="text-2xl font-bold">April - May Trip</h1>
            <p class="text-indigo-100 dark:text-indigo-200 opacity-90">Toronto • Singapore • Cruise • Japan</p>
        </div>
        <button onclick="toggleTheme()" class="p-2 rounded-full hover:bg-indigo-500 dark:hover:bg-indigo-800 transition-colors" aria-label="Toggle Dark Mode">
            <!-- Moon icon (shows in light mode) -->
            <svg class="w-6 h-6 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
            </svg>
            <!-- Sun icon (shows in dark mode) -->
            <svg class="w-6 h-6 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
            </svg>
        </button>
    </header>

    <!-- Navigation Filter -->
    <div class="overflow-x-auto whitespace-nowrap p-4 flex gap-2 no-scrollbar">
        <button onclick="scrollToDate('April 14')" class="nav-btn bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 px-4 py-2 rounded-full text-sm font-semibold shadow-sm border border-slate-200 dark:border-slate-700 shrink-0 transition-colors">Toronto</button>
        <button onclick="scrollToDate('April 15')" class="nav-btn bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 px-4 py-2 rounded-full text-sm font-semibold shadow-sm border border-slate-200 dark:border-slate-700 shrink-0 transition-colors">Singapore</button>
        <button onclick="scrollToDate('April 17')" class="nav-btn bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 px-4 py-2 rounded-full text-sm font-semibold shadow-sm border border-slate-200 dark:border-slate-700 shrink-0 transition-colors">Cruise</button>
        <button onclick="scrollToDate('April 20')" class="nav-btn bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 px-4 py-2 rounded-full text-sm font-semibold shadow-sm border border-slate-200 dark:border-slate-700 shrink-0 transition-colors">Hue/Danang</button>
        <button onclick="scrollToDate('April 22')" class="nav-btn bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 px-4 py-2 rounded-full text-sm font-semibold shadow-sm border border-slate-200 dark:border-slate-700 shrink-0 transition-colors">Hong Kong</button>
        <button onclick="scrollToDate('April 24')" class="nav-btn bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 px-4 py-2 rounded-full text-sm font-semibold shadow-sm border border-slate-200 dark:border-slate-700 shrink-0 transition-colors">Taipei</button>
        <button onclick="scrollToDate('April 26')" class="nav-btn bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 px-4 py-2 rounded-full text-sm font-semibold shadow-sm border border-slate-200 dark:border-slate-700 shrink-0 transition-colors">Nagasaki</button>
        <button onclick="scrollToDate('April 28')" class="nav-btn bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 px-4 py-2 rounded-full text-sm font-semibold shadow-sm border border-slate-200 dark:border-slate-700 shrink-0 transition-colors">Kyoto/Osaka</button>
        <button onclick="scrollToDate('April 29')" class="nav-btn bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 px-4 py-2 rounded-full text-sm font-semibold shadow-sm border border-slate-200 dark:border-slate-700 shrink-0 transition-colors">Kobe/Mt. Fuji</button>
        <button onclick="scrollToDate('May 1')" class="nav-btn bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 px-4 py-2 rounded-full text-sm font-semibold shadow-sm border border-slate-200 dark:border-slate-700 shrink-0 transition-colors">Tokyo</button>
    </div>

    <!-- Itinerary Container -->
    <main id="itinerary" class="px-4 mt-2">
        <!-- Content will be injected by JavaScript -->
    </main>

    <script>
        const itineraryData = [
            { date: "April 14", location: "Toronto, Canada", events: [{ time: "1:25 PM", activity: "Board Plane at Toronto Pearson", type: "flight" }] },
            { date: "April 15", location: "Tokyo & Singapore", events: [{ time: "2:45 AM", activity: "Narita Airport Layover", details: "Eat something, check out airport", type: "flight" }, { time: "6:00 AM", activity: "Board flight to Singapore", type: "flight" }, { time: "12:55 AM", activity: "Arrive Singapore", details: "Go to hotel (Fairmont Singapore) to drop off luggage.", type: "hotel" }] },
            { date: "April 16", location: "Singapore", events: [{ time: "Morning", activity: "Local Foods Hunt", details: "Kaya toast (Ya Kun), Chicken and Rice (Tien Tien@Maxwell), Chile Crab, Kway tiew, Laksa (Chinatown complex). McDonald's for Sean when we go to hawker centres", type: "food" }, { time: "Afternoon/Evening", activity: "Sightseeing", details: "Merlion park, sky park observation deck, Garden by the bay. Sunset at 7pm. Chatterbox restaurant (Hilton) dinner, ask about Fairmont restaurant for Sean?", type: "sightseeing" }] },
            { date: "April 17", location: "Singapore / Board Cruise", events: [{ time: "Morning", activity: "Pack up & Checkout", details: "Buy souvenirs. Gyukatsu Kyoto Katsugyu (close to hotel)", type: "hotel" }, { time: "2:00 PM", activity: "Board Cruise", details: "Board cruise @ 2:00pm at Mariana Bay", type: "cruise" }] },
            { date: "April 18", location: "At Sea", isBirthday: true, events: [{ time: "All day", activity: "HAILEY'S BIRTHDAYYYYYY!!!!!!!!!!!!!!!!!!!!!!!", details: "Explore cruise.", type: "special" }] },
            { date: "April 19", location: "At Sea", events: [{ time: "All day", activity: "Cruising", type: "cruise" }] },
            { date: "April 20", location: "Hue/Danang (Chan May), Vietnam", events: [{ time: "7:30 AM (Disembark)", activity: "Bui Vien & Ben Thanh", details: "Eat breakfast on cruise and then go. Bui Vien Walking street and Ben Thanh Market. Pho Minh (7min walk from Ben Thanh, Michelin)", type: "food" }, { time: "8:15 PM (All Aboard)", activity: "Street Food", details: "Try street food (boiled or deep fried foods only). Buy souvenirs. Gotta try pho and Viet coffee", type: "food" }] },
            { date: "April 21", location: "At Sea", events: [{ time: "All day", activity: "Cruising", type: "cruise" }] },
            { date: "April 22", location: "Hong Kong, China", events: [{ time: "7:30 AM (Disembark)", activity: "Victoria Peak", details: "Eat breakfast on cruise and then go. Take a tram to Victoria peak. Lunch at restaurant Donald chose.", type: "sightseeing" }, { time: "8:15 PM (All Aboard)", activity: "Walk around Hong Kong", details: "Buy souvenirs then go back to boat. Lunch at a fancy hotel overlooking skyline", type: "sightseeing" }] },
            { date: "April 23", location: "At Sea", events: [{ time: "All day", activity: "Cruising", type: "cruise" }] },
            { date: "April 24", location: "Taipei, Taiwan", events: [{ time: "7:30 AM (Disembark)", activity: "Taipei 101", details: "Go Taipei 101, wherever Will takes us, buy souvenirs. HAVE TO TRY BOBABABAOBABOBA (50 Lan), Ding Tai Fung", type: "food" }, { time: "6:15 PM (All Aboard)", activity: "Taipei Evening", details: "HAVE TO TRY BOBABABAOBABOBA (50 Lan), Ding Tai Fung", type: "food" }] },
            { date: "April 25", location: "At Sea", events: [{ time: "All day", activity: "Cruising", type: "cruise" }] },
            { date: "April 26", location: "Nagasaki, Japan", events: [{ time: "7:30 AM (Disembark)", activity: "Atomic Bomb Museum", details: "Buy souvenirs", type: "sightseeing" }, { time: "9:15 PM (All Aboard)", activity: "Nagasaki Peace Park", details: "See cherry blossoms and monument. Hypocentre of atomic bombing.", type: "sightseeing" }] },
            { date: "April 27", location: "At Sea", events: [{ time: "All day", activity: "Cruising", type: "cruise" }] },
            { date: "April 28", location: "Kyoto & Osaka", events: [{ time: "7:30 AM (Disembark)", activity: "Kyoto Temple Tour", details: "Take train to Kyoto, Kinkaku-ji Golden Temple (30 min taxi to FIT), Fushimi Inari Taisha (Senbon Torrii). Salmon Noodle, Gion Komori Kyoto (matcha mochi), Matcha ice cream at Gio Saryo Tsujiri Tea House", type: "sightseeing" }, { time: "Afternoon", activity: "Osaka City", details: "Take train to Osaka, Namba Yasaka Shrine (19min walk to Dontonbori), Dotonburi, Kirby Cafe (10 min walk from Dotonburi), Osaka castle (10min taxi from Kirby cafe). Gyozaoh! Dotonbori, Genjisoba, Chibo Okonomiyaki, Naniwasoba Kitahama", type: "food" }, { time: "Nighttime", activity: "Arima Onsen Check-in", details: "Check in at hotel Arima Onsen Taketoritei Maruyama, use hot springs", type: "hotel" }] },
            { date: "April 29", location: "Kobe, Japan", events: [{ time: "2:45 PM (All Aboard)", activity: "RESERVATION: Kujira no Andy", details: "Travel back to Kobe, find Kobe beef for lunch, buy souvenirs. Ishida Kobe, Kobe Plaisir, Kobe Kujira no Andy. Reserved Kujira no. Andy @ 12pm", type: "booking" }] },
            { date: "April 30", location: "Mount Fuji, Japan", events: [{ time: "10:30 AM (Disembark)", activity: "Chureito Pagoda", details: "Go to pagoda to take picture of Mt. Fuji, buy souvenirs", type: "sightseeing" }, { time: "6:15 PM (All Aboard)", activity: "Chureito Pagoda (Evening)", details: "Go to pagoda to take picture of Mt. Fuji, buy souvenirs", type: "sightseeing" }] },
            { date: "May 1", location: "Yokohama to Tokyo", events: [{ time: "7:00 AM (Final Disembark)", activity: "TICKET: Cup Noodle Museum @ 10am", details: "Leave luggage at lockers at Shin-Yokohama station. Shin Ramen Museum (30 min taxi from cruise terminal).", type: "booking" }, { time: "Afternoon", activity: "Check-in Tokyo", details: "Travel to Tokyo and check into hotel (Tokyo Bay Prince Shiomi). Yoshinoya or Sukiya gyudon, Gyukatsu Kyoto Katsugyu", type: "hotel" }] },
            { date: "May 2", location: "Tokyo, Japan", events: [{ time: "All day", activity: "Disney Sea", type: "sightseeing" }] },
            { date: "May 3", location: "Tokyo, Japan", events: [{ time: "Morning", activity: "Tsukiji Fish Market", details: "Taxi 7 min from hotel, Nine hours capsule hotel visit, Tokyo Tower. Sushiro conveyor", type: "food" }, { time: "Afternoon-Night", activity: "BOOKING: Sumoland Wrestling @ 6pm", details: "Akihabara, Don Quijote, sensoji?, Dawn avator robot cafe, Pokemon cafe? Asakusa Chaya Tabanenoshi near Sensoji.", type: "booking" }] },
            { date: "May 4", location: "Tokyo, Japan", events: [{ time: "Morning", activity: "Pokemon Centre", details: "Gashapon Department Store Ikebukuro Main Store", type: "sightseeing" }, { time: "Afternoon-Night", activity: "BOOKING: Hikinikutocome @ 1:45PM", details: "Harujuku, Shinjuku, Meiji Shrine?, Shibuya Crossing, Squid Game Experience, One Piece shop, Shibuya sky. Ichiran ramen, April 19 Shibuya Sky (12am)", type: "booking" }] },
            { date: "May 5", location: "Tokyo, Japan", events: [{ time: "Morning", activity: "TICKET: TeamLabs Planets @ 10am", details: "Joypolis", type: "booking" }, { time: "Afternoon-Night", activity: "Disaster Prevention Park", details: "The Tokyo Rinkai Disaster Prevention Park. Yakiniku Happy Ningyocho, Pizza Slice Commissary (nut free), Savoy pizza Azabujuban", type: "food" }] },
            { date: "May 6", location: "Tokyo / Return", events: [{ time: "Morning", activity: "Pack & Checkout", details: "Store luggage at hotel. Terminal 3 (Taxi from hotel 17min)", type: "hotel" }, { time: "6:10 PM", activity: "Flight Departure", details: "Flying out. Be there by 3pm", type: "flight" }, { time: "5:35 PM", activity: "WELCOME HOMEEEEEE", details: "Toronto, Canada", type: "special" }] }
        ];

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        }

        function getIcon(type) {
            switch(type) {
                case 'flight': return '✈️';
                case 'food': return '🍜';
                case 'hotel': return '🏨';
                case 'sightseeing': return '📸';
                case 'cruise': return '🚢';
                case 'booking': return '🎟️';
                case 'special': return '🎉';
                default: return '📍';
            }
        }

        function getBg(type) {
            switch(type) {
                case 'booking': return 'bg-amber-50 dark:bg-amber-900/30 border-amber-200 dark:border-amber-800/50';
                case 'special': return 'bg-pink-50 dark:bg-pink-900/30 border-pink-200 dark:border-pink-800/50';
                case 'flight': return 'bg-blue-50 dark:bg-blue-900/30 border-blue-200 dark:border-blue-800/50';
                default: return 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700';
            }
        }

        function renderItinerary() {
            const container = document.getElementById('itinerary');
            itineraryData.forEach(day => {
                const daySection = document.createElement('section');
                daySection.id = day.date.replace(' ', '-');
                daySection.className = "mb-8 relative timeline-line";

                let html = `
                    <div class="sticky-date py-2 mb-4 flex items-baseline gap-3 border-b border-slate-200 dark:border-slate-700 transition-colors duration-300">
                        <span class="text-xl font-bold text-slate-800 dark:text-slate-100">${day.date}</span>
                        <span class="text-sm text-slate-500 dark:text-slate-400 font-medium">${day.location}</span>
                    </div>
                `;

                day.events.forEach(event => {
                    const bgClass = getBg(event.type);
                    const icon = getIcon(event.type);
                    const isBirthday = day.isBirthday ? 'birthday-glow border-pink-400 dark:border-pink-500' : '';

                    html += `
                        <div class="activity-card ml-10 mb-4 p-4 rounded-2xl border shadow-sm ${bgClass} ${isBirthday} relative">
                            <!-- Timeline Dot -->
                            <div class="absolute -left-10 top-1/2 -translate-y-1/2 w-4 h-4 rounded-full bg-indigo-500 border-4 border-slate-50 dark:border-slate-900 transition-colors"></div>
                            
                            <div class="flex justify-between items-start mb-1">
                                <span class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">${event.time}</span>
                                <span>${icon}</span>
                            </div>
                            <h3 class="font-bold text-slate-800 dark:text-slate-100 text-lg leading-tight">${event.activity}</h3>
                            ${event.details ? `<p class="text-sm text-slate-600 dark:text-slate-300 mt-2 leading-relaxed">${event.details}</p>` : ''}
                        </div>
                    `;
                });

                daySection.innerHTML = html;
                container.appendChild(daySection);
            });

            // Automatically check today's date and scroll after render
            scrollToToday();
        }

        function scrollToDate(dateStr) {
            const id = dateStr.replace(' ', '-');
            const el = document.getElementById(id);
            if (el) {
                const yOffset = -100; // Account for the sticky header
                const y = el.getBoundingClientRect().top + window.pageYOffset + yOffset;
                window.scrollTo({top: y, behavior: 'smooth'});
            }
        }

        function scrollToToday() {
            const today = new Date();
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            
            // Format current date to match "April 14" format
            const currentMonthStr = monthNames[today.getMonth()];
            const currentDateStr = `${currentMonthStr} ${today.getDate()}`;
            
            // Check if today is a date listed in the itinerary
            const targetId = currentDateStr.replace(' ', '-');
            
            if (document.getElementById(targetId)) {
                // Add a small delay so the user briefly sees the top before it jumps down automatically
                setTimeout(() => {
                    scrollToDate(currentDateStr);
                }, 800);
            }
            // If the date isn't found (e.g., viewing before the trip starts), it will naturally just stay at the top.
        }

        window.onload = renderItinerary;
    </script>
</body>
</html>
